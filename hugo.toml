baseURL           = "https://www.zero-day.ai/"
locale            = "en-us"
title             = "Zero Day AI Labs"
theme             = "zdl"
enableRobotsTXT   = true
enableGitInfo     = false
summaryLength     = 30

[taxonomies]
  tag = "tags"

[params]
  description = "Hands-on training for the engineer who has to see the whole picture. You learn how AI systems break, why they broke, and how to ship one you can stand behind."
  eyebrow     = "Offensive and defensive AI training"
  beehiiv     = "https://zero-day-ai.beehiiv.com"
  ogimage     = "/og.png"
  mailbox     = "info@zero-day.ai"
  course_format = "Ten weeks, live online. Two one-hour sessions a week and one lab a week."


[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses      = false
    lineNos        = false
    tabWidth       = 2
    style          = "github-dark"


[menus]
  [[menus.main]]
    name   = "Research"
    url    = "/research/"
    weight = 1
  [[menus.main]]
    name   = "Training"
    url    = "/training/"
    weight = 2
  [[menus.main]]
    name   = "Services"
    url    = "/services/"
    weight = 3
  [[menus.main]]
    name   = "Products"
    url    = "/products/"
    weight = 4
  [[menus.main]]
    name   = "About"
    url    = "/about/"
    weight = 5
  [[menus.footer]]
    name   = "Privacy"
    url    = "/privacy/"
    weight = 1
  [[menus.footer]]
    name   = "Terms"
    url    = "/terms/"
    weight = 2
