baseURL           = "https://www.zero-day.ai/"
locale            = "en-us"
title             = "Zero Day AI Labs"
theme             = "zdl"
enableRobotsTXT   = true
enableGitInfo     = false
summaryLength     = 30

# Taxonomies are switched on with the blog slice, together with their templates.
disableKinds = ["taxonomy", "term"]

[params]
  description = "Hands-on training in how AI systems are attacked, and how to defend the ones you put in production."
  eyebrow     = "Offensive and defensive AI training"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses      = false
    lineNos        = false
    tabWidth       = 2
    style          = "github-dark"

