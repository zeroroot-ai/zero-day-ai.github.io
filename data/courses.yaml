# The courses. A course is one curriculum with a limited number of seats per
# cohort. The site shows no price and no seat count. The price lives on the
# Stripe Payment Link. Every course runs in every cohort, so a course carries no date. The
# dates live in data/cohorts.yaml and the format line lives in hugo.toml.
#
# enroll_url stays empty until the owner says the cohort is on sale. While it
# is empty the course page renders the training list form in place of a buy
# button.
- slug: llm-infrastructure-on-kubernetes
  name: LLM Infrastructure on Kubernetes
  short: Kubernetes
  color: cyan
  blurb: >
    You build GPU nodes, schedulers, model serving, and the boundary around
    the agents that call the models. We taught this course before. This run
    adds Slurm, the NVIDIA stack, and KServe.
  enroll_url: ""
- slug: agents-in-production
  name: Agents in Production
  short: Agents
  color: acid
  blurb: >
    You learn how to run an agent fleet for real: identity, grants, sandboxed
    execution, budgets, and replay. The patterns come from Gibson.
  enroll_url: ""
- slug: attacking-and-defending-ai-agents
  name: Attacking and Defending AI Agents
  short: Agents, offense and defense
  color: mag
  blurb: >
    The first half breaks agents the way the published attacks do. The
    second half rebuilds one that refuses every one of them, and you measure
    it on AgentDojo before and after.
  enroll_url: ""
