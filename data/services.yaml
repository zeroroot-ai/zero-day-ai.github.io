# Two fixed offers. We do not sell hours. Prices are ranges in US dollars and
# the low end is the number every post quotes.
- slug: assessment
  name: Agent Security Assessment
  price_low: 45000
  price_high: 75000
  length: Three weeks
  team: One senior operator does the work. The founder reviews it.
  blurb: >
    We attack your agent deployment the way an adversary would, then we
    tell you what a control has to refuse, not merely detect.
  deliver:
    - A written report, with findings ranked. Each finding names the input that produced it and the control that stops it.
    - A live replay of every successful attack, in your environment, for your team.
    - A reference design for the boundary, mapped onto what you already run.
    - One public write-up on this site, with your name removed. You approve it first.
- slug: build
  name: Agent Platform Build
  price_low: 150000
  price_high: 400000
  length: Eight to twelve weeks
  team: Two operators do the work. The founder reviews it.
  blurb: >
    We stand up the runtime your agents execute inside. Identity, grants,
    sandboxed execution, budgets, and replay. Gibson is the reference
    architecture, and you own the result.
  deliver:
    - A running platform in your account, with the agents you name on it.
    - Every step of every agent run journaled and replayable.
    - Your engineers trained on it. They keep it after we leave.
    - One public write-up on this site, with your name removed. You approve it first.
