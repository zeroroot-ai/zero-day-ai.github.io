# Two fixed offers. The site shows no price. We fix the price on the first call.
- slug: assessment
  name: Agent Production Readiness Assessment and Implementation
  length: Scoped on the first call
  team: One senior operator does the assessment. The founder reviews it.
  blurb: >
    Everything that stands between your agents and production, in one
    assessment. We attack your agents the way the published attacks do. We
    also find every other gap: identity, authorization, isolation, models,
    cost, and audit. Then we close the gaps with you, on one of two paths.
  paths:
    - label: Fix what you have
      name: The Agent Production Blueprint
      blurb: >
        For the team that is almost there. You have agents on LangChain,
        LangGraph, CrewAI, or your own code, and they work. Nobody designed
        them to pass a security review. The Blueprint is our method for
        taking that stack to production without a rewrite.
      deliver:
        - A readiness report. Every gap ranked, with the change that closes it.
        - The attack results, mapped to the OWASP Agentic Top 10 and MITRE ATLAS. Each finding names the input that produced it and the control that stops it.
        - A live replay of every successful attack, in your environment, for your team.
        - A reference architecture for your agents on your stack. It names every identity, every boundary, and every data flow.
        - The implementation. We build the controls into your stack with your engineers, in the order the report ranks them.
    - label: Bring Gibson
      name: Everything out of the box
      blurb: >
        For the team that does not want to build the platform. Gibson brings
        identity, grants, sandboxes, budgets, and replay on day one. We put
        your agents on it, and the gaps the assessment found close because
        the runtime closes them.
      deliver:
        - The same readiness report and attack results, so you can see what Gibson closes.
        - Gibson installed on your Kubernetes cluster, linked to your identity provider, your secret store, and your models.
        - Your existing agents moved onto Gibson, with a grant, a sandbox, and a journal each.
        - The same attacks run again, to show that each one now fails.
- slug: build
  name: Agentic Software Factory
  url: https://www.zeroroot.ai/
  length: Eight to twelve weeks
  team: Two operators do the work. The founder reviews it.
  blurb: >
    Every consultant will build you an agent platform from scratch. We do
    not. We bring one that already runs. Gibson ships identity, grants,
    sandboxes, budgets, and replay, and it passes our own tests every day.
    The build installs it on your cluster, links it to your systems, and
    puts your first agents on it. You own the result.
  deliver:
    - A running platform on your Kubernetes, with the first three agents you named in production.
    - Sign-off from your security team, because they can read what each agent may do and replay what it did.
    - Your engineers trained on it. They ship the fourth agent without us.
    - Nothing bespoke that only we can maintain. Gibson is source-available under ELv2, the SDK is Apache 2.0, and the repository holds every design decision.
