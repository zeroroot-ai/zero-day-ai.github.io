{{/* Google Analytics, the plain tag. It counts page views on every page
     from the first load. The privacy page says so and names the browser
     opt-out. One site param, ga_id, turns it on. */}}
{{ with .Site.Params.ga_id }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", {{ . }});
</script>
{{ end }}
