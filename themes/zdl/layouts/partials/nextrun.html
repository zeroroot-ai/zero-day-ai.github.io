{{/* The strip under the hero. One course, one date, one price, one link. */}}
{{ with index (where hugo.Data.courses "status" "scheduled") 0 }}
<div class="nextrun scan">
  <div class="wrap">
    <span class="pixlabel">Next live course</span>
    <b>{{ .name }}</b>
    <span class="meta">{{ .when }} &middot; {{ lang.FormatNumberCustom 0 .price }} USD &middot; {{ .seats }} seats &middot; recorded</span>
    <a class="btn small" href="{{ (printf "/training/%s/" .slug) | relURL }}">Hold a seat</a>
  </div>
</div>
{{ end }}
